<!doctype html>
<html lang="es-AR">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="light">
    <title>{% block title %}{{ app_name }}{% endblock %}</title>

    <link rel="preload" href="{{ url_for('static', path='vendor/geist/Geist-Variable.woff2') }}" as="font" type="font/woff2" crossorigin>
    <link rel="preload" href="{{ url_for('static', path='vendor/tabler/fonts/tabler-icons.woff2') }}" as="font" type="font/woff2" crossorigin>
    <link rel="stylesheet" href="{{ url_for('static', path='vendor/geist/geist.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', path='vendor/tabler/tabler-icons.min.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', path='css/app.css') }}">
    {% block head %}{% endblock %}
    <link rel="stylesheet" href="{{ url_for('static', path='css/buttons.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', path='css/density.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', path='css/select.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', path='css/motion.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', path='css/states.css') }}">

    <script src="{{ url_for('static', path='vendor/htmx/htmx.min.js') }}" defer></script>
    <script src="{{ url_for('static', path='js/app.js') }}" defer></script>
    <script src="{{ url_for('static', path='js/select.js') }}" defer></script>
</head>
<body
    data-csrf-token="{{ csrf_token|default('') }}"
    data-current-user-first-name="{{ current_user_first_name|default('') }}"
    data-current-user-initials="{{ current_user_initials|default('') }}"
>
    {% block body %}{% endblock %}
</body>
</html>
